<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drink Tracker</title>
  <meta name="description" content="Tutti i cocktail del mondo con ingredienti, e il registro dei drink che hai già bevuto.">
  <meta name="theme-color" content="#14141f">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drink Tracker">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Drink Tracker</h1>
    <button class="btn btn-install" id="installBtn" hidden>Installa</button>
  </header>

  <div class="hint" id="hint" hidden>
    <p>Suggerimento: per installare l'app su iPhone apri questo sito in Safari, poi <b>Condividi</b> &rarr; <b>Aggiungi a Home Screen</b>.</p>
    <button id="hintClose" aria-label="Chiudi suggerimento">&times;</button>
  </div>

  <p class="stats" id="stats"></p>

  <main>
    <div class="controls">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Cerca un drink per nome…" autocomplete="off">
      </div>
      <div class="filters">
        <div class="segmented" role="group" aria-label="Filtra per stato bevuto">
          <button type="button" class="seg-btn is-active" data-state="">Tutti</button>
          <button type="button" class="seg-btn" data-state="drunk">Bevuti</button>
          <button type="button" class="seg-btn" data-state="todo">Da bere</button>
        </div>
        <select id="filterCategory" aria-label="Filtra per categoria">
          <option value="">Categoria</option>
        </select>
        <select id="filterAlcoholic" aria-label="Filtra alcolico / analcolico">
          <option value="">Alcolico / Analcolico</option>
          <option value="Alcoholic">Alcolici</option>
          <option value="Non_Alcoholic">Analcolici</option>
        </select>
        <input id="filterIngredient" type="text" list="ingredientList" placeholder="Ingrediente (es. Gin, poi Invio)…" autocomplete="off">
        <datalist id="ingredientList"></datalist>
        <button class="btn-clear" id="clearFilters" hidden>Azzera filtri</button>
      </div>
    </div>

    <div id="status" class="status" hidden></div>
    <div id="grid" class="grid"></div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Dettaglio drink">
      <button class="modal-close" data-close aria-label="Chiudi">&times;</button>
      <div id="detail" class="detail"></div>
    </div>
  </div>

  <noscript>
    <p style="padding: 20px; text-align: center;">Questa app richiede JavaScript.</p>
  </noscript>

  <script src="./js/store.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
